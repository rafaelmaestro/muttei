name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# signs the updater artifacts; the app only installs updates signed by this key (pubkey in tauri.conf.json)
env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  linux:
    # 22.04 so the .deb also installs on older glibc; webkit2gtk-4.1 exists there
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # release tests share the compiled deps with the release build below
      - run: cargo test --release
        working-directory: src-tauri
      - id: build
        env:
          # the prebuilt CLI from npm installs in seconds; cargo install compiled it for 12 minutes
          TAURI: npx --yes @tauri-apps/cli@2
        run: |
          echo "deb=src-tauri/$(./scripts/package-deb.sh | tail -1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(./scripts/package-extension.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ${{ steps.build.outputs.deb }}
            ${{ steps.build.outputs.deb }}.sig
            ${{ steps.build.outputs.zip }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # release tests share the compiled deps with the release build below
      - run: cargo test --release
        working-directory: src-tauri
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --release
        working-directory: src-tauri
      # one .dmg for Apple Silicon and Intel; unsigned, so Gatekeeper asks once (see README)
      - run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      # latest.json is what installed apps poll (releases/latest/download/latest.json)
      - run: |
          v=${GITHUB_REF_NAME#v}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          app=$(find dist -name '*.app.tar.gz')
          mv "$app" "dist/macos/Muttei_${v}_universal.app.tar.gz"
          mv "$app.sig" "dist/macos/Muttei_${v}_universal.app.tar.gz.sig"
          entry() { f=$(find dist -name "$1" ! -name '*.sig'); jq -n --arg url "$base/$(basename "$f")" --arg sig "$(cat "$f.sig")" '{url:$url,signature:$sig}'; }
          deb=$(entry '*.deb'); exe=$(entry '*-setup.exe'); mac=$(entry '*.app.tar.gz')
          jq -n --arg v "$v" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson deb "$deb" --argjson exe "$exe" --argjson mac "$mac" \
            '{version:$v, pub_date:$date, notes:"", platforms:{"linux-x86_64-deb":$deb, "windows-x86_64-nsis":$exe, "windows-x86_64":$exe, "darwin-aarch64":$mac, "darwin-x86_64":$mac}}' > dist/latest.json
          cat dist/latest.json
      - run: gh release create "$GITHUB_REF_NAME" $(find dist -type f ! -name '*.sig') --repo "$GITHUB_REPOSITORY" --title "Muttei $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
