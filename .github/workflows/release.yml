name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # 22.04 so the .deb also installs on older glibc; webkit2gtk-4.1 exists there
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # release tests share the compiled deps with the release build below
      - run: cargo test --release
        working-directory: src-tauri
      - id: build
        env:
          # the prebuilt CLI from npm installs in seconds; cargo install compiled it for 12 minutes
          TAURI: npx --yes @tauri-apps/cli@2
        run: |
          echo "deb=src-tauri/$(./scripts/package-deb.sh | tail -1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(./scripts/package-extension.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            ${{ steps.build.outputs.deb }}
            ${{ steps.build.outputs.zip }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # release tests share the compiled deps with the release build below
      - run: cargo test --release
        working-directory: src-tauri
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --release
        working-directory: src-tauri
      # one .dmg for Apple Silicon and Intel; unsigned, so Gatekeeper asks once (see README)
      - run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" $(find dist -type f) --repo "$GITHUB_REPOSITORY" --title "Muttei $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
