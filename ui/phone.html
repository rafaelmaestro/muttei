<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14151b">
<title>Muttei</title>
<style>
@font-face{font-family:"IBM Plex Sans";font-weight:100 700;font-display:swap;src:url(/fonts/IBMPlexSans.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-weight:100 800;font-display:swap;src:url(/fonts/JetBrainsMono.woff2) format("woff2")}
/* telas do celular do protótipo aprovado, em tela cheia */
:root{--fg:#f8f8f2;--muted:#9a9dbb;--comment:#6272a4;--accent:#bd93f9;--ok:#50fa7b;--bad:#ff5555;--bad-soft:rgba(255,85,85,.14);--ok-soft:rgba(80,250,123,.12);
  --sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#14151b;color:var(--fg);font:13px/1.45 var(--sans);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 0;text-align:center}
.pbody.buzz{animation:buzz .32s linear}
@keyframes buzz{20%{transform:translateX(-3px) rotate(-.6deg)}40%{transform:translateX(3px) rotate(.6deg)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.pbody h3{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.pbody p{margin:0;color:var(--muted);font-size:13px;max-width:28ch}
.cam{width:180px;height:180px;border-radius:16px;border:2px dashed #44475a;display:grid;place-items:center;color:var(--muted)}
.pin{display:flex;gap:8px}
.pin input{width:52px;height:62px;text-align:center;font:700 24px var(--mono);background:#1f2029;border:1px solid #44475a;border-radius:10px;outline:none;color:var(--fg)}
.pin input:focus{border-color:var(--accent)}
.pin.bad input{border-color:var(--bad);animation:buzz .3s}
.bigmic{width:min(62vw,240px);height:min(62vw,240px);border-radius:50%;display:grid;place-items:center;transition:background .2s,box-shadow .2s;background:var(--ok-soft);color:var(--ok);box-shadow:0 0 0 10px rgba(80,250,123,.06)}
.bigmic.muted{background:var(--bad-soft);color:var(--bad);box-shadow:0 0 0 10px rgba(255,85,85,.07)}
.bigmic svg{width:38%;height:38%}
.pstate{font:600 22px var(--sans)}
.pstate.muted{color:var(--bad)}.pstate.on{color:var(--ok)}
.pfoot{font:11px var(--mono);color:var(--comment);padding:10px;text-align:center;flex:none}
.pbtn{padding:10px 22px;border-radius:999px;background:var(--accent);color:#282a36;font-weight:600}
.pbtn.ghost{background:transparent;color:var(--muted);border:1px solid #44475a}
.perr{color:var(--bad);font-size:12.5px;min-height:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pbody" id="pbody"></div>
<div class="pfoot" id="pfoot"></div>
<script>
const ICON = {
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  micOff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.9-.8M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11.3 5.5M12 18v3"/></svg>',
  phone:'<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>'
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const store = { get(){ try{ return localStorage.getItem('muttei-token'); }catch(e){ return null; } },
                set(v){ try{ v ? localStorage.setItem('muttei-token', v) : localStorage.removeItem('muttei-token'); }catch(e){} } };
const st = { screen: store.get() ? 'wait' : 'pin', err:'', muted:false, host:location.hostname, token:store.get() };
let ws;

function buzz(){ const b=$('#pbody'); b.classList.remove('buzz'); void b.offsetWidth; b.classList.add('buzz'); try{ navigator.vibrate && navigator.vibrate(40); }catch(e){} }
const send = m => { if(ws && ws.readyState===1) ws.send(JSON.stringify(m)); };

function connect(){
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = ()=>{ if(st.token) send({t:'hello', token:st.token}); else if(st.screen==='scan' && !st.err) { st.screen='pin'; render(); } };
  ws.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(m.host) st.host = m.host;
    if(m.t==='paired'){ st.token=m.token; store.set(m.token); st.muted=m.muted; st.screen='ctl'; st.err=''; buzz(); }
    else if(m.t==='bad'){ st.err=`Código errado. ${m.left} tentativa${m.left>1?'s':''} antes de gerar um novo.`; render(); const p=$('.pin'); p&&p.classList.add('bad'); return; }
    else if(m.t==='regen'){ st.err='5 tentativas erradas. O PC gerou um código novo; espere 1 minuto.'; }
    else if(m.t==='locked'){ st.err=`Muitas tentativas. Espere ${m.secs} s e use o código novo.`; }
    else if(m.t==='revoked'){ st.token=null; store.set(null); st.screen='scan'; st.err='O PC revogou o acesso deste celular.'; }
    else if(m.t==='state'){ st.muted=m.muted; if(st.screen==='wait') st.screen='ctl'; }
    else if(m.t==='ack'){ st.muted=m.muted; buzz(); }
    render();
  };
  ws.onclose = ()=>{
    if(st.screen==='ctl' || st.screen==='wait'){ st.screen='scan'; st.err='Conexão perdida. Tentando de novo…'; render(); }
    setTimeout(connect, 2000);
  };
}

function render(){
  const pb = $('#pbody'), pf = $('#pfoot');
  if(st.screen==='scan'){
    pb.innerHTML = `<h3>Muttei no celular</h3><div class="cam">${ICON.phone}</div>
      <p>Abra a câmera e aponte para o QR em Ajustes &gt; Celular.</p><button class="pbtn" id="pRetry">Tentar de novo</button><div class="perr">${esc(st.err)}</div>`;
    pf.textContent = 'sem app para instalar';
    $('#pRetry').onclick = ()=>{ st.err=''; st.screen = st.token ? 'wait' : 'pin'; render(); if(st.token) send({t:'hello', token:st.token}); };
  } else if(st.screen==='pin'){
    pb.innerHTML = `<h3>Digite o código do PC</h3><p>Os 4 dígitos que aparecem em Ajustes &gt; Celular.</p>
      <form class="pin" id="pinF">${[0,1,2,3].map(i=>`<input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Dígito ${i+1}" id="pin${i}">`).join('')}</form>
      <div class="perr">${esc(st.err)}</div>`;
    pf.textContent = `${st.host} · ${location.hostname}`;
    const ins = [...pb.querySelectorAll('.pin input')];
    ins.forEach((inp,i)=>{
      inp.oninput=()=>{ inp.value=inp.value.replace(/\D/g,'').slice(-1); pb.querySelector('.pin').classList.remove('bad');
        if(inp.value && i<3) ins[i+1].focus();
        const v = ins.map(x=>x.value).join(''); if(v.length===4) send({t:'pair', code:v}); };
      inp.onkeydown=e=>{ if(e.key==='Backspace' && !inp.value && i>0) ins[i-1].focus(); };
    });
    ins[0].focus();
  } else if(st.screen==='wait'){
    pb.innerHTML = `<h3>Conectando…</h3>`;
    pf.textContent = location.host;
  } else {
    pb.innerHTML = `<button class="bigmic ${st.muted?'muted':''}" id="pMic" aria-label="${st.muted?'Desmutar':'Mutar'} o PC">${st.muted?ICON.micOff:ICON.mic}</button>
      <div class="pstate ${st.muted?'muted':'on'}">${st.muted?'Mudo':'No ar'}</div><p>Toque para ${st.muted?'abrir':'fechar'} o microfone do PC.</p>`;
    pf.textContent = `● conectado a ${st.host} · token ${st.token.slice(0,6)}…`;
    $('#pMic').onclick = ()=>send({t:'toggle', token:st.token});
  }
}
render();
connect();
</script>
</body>
</html>
